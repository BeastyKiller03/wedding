<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Marco & Jess Wedding Invitation</title>

  <style>
    :root {
      --bg: #100c0d;
      --paper: #f4eadb;
      --paper-soft: #eadcc8;
      --ink: #241817;
      --muted: #7b685e;
      --red: #561f29;
      --green: #1d3a2c;
      --plum: #3b243d;
      --gold: #b99b63;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, rgba(86, 31, 41, 0.45), transparent 34%),
        radial-gradient(circle at bottom right, rgba(29, 58, 44, 0.38), transparent 34%),
        radial-gradient(circle at center, rgba(185, 155, 99, 0.08), transparent 45%),
        var(--bg);
      color: var(--paper);
    }

    body {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      overflow-x: hidden;
    }

    .app {
      width: min(94vw, 430px);
      min-height: 92svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
    }

    .slide {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 520ms ease both;
    }

    .slide.fade-out {
      animation: fadeOut 260ms ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      to {
        opacity: 0;
        transform: translateY(-12px) scale(0.97);
      }
    }

    .image-card {
      width: 100%;
      max-width: 430px;
      height: auto;
      display: block;
      border-radius: 18px;
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.48),
        0 2px 0 rgba(255,255,255,0.08) inset;
      background: var(--paper-soft);
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .open-card {
      width: 100%;
      max-width: 430px;
      min-height: 520px;
      border-radius: 20px;
      background:
        linear-gradient(130deg, rgba(255,255,255,0.32), transparent 25%),
        repeating-linear-gradient(
          -35deg,
          rgba(86, 31, 41, 0.08) 0,
          rgba(86, 31, 41, 0.08) 2px,
          transparent 2px,
          transparent 18px
        ),
        #e7d8c2;
      color: var(--ink);
      box-shadow: 0 24px 70px rgba(0,0,0,0.48);
      position: relative;
      overflow: hidden;
      padding: 38px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .open-card::before,
    .open-card::after {
      content: "";
      position: absolute;
      inset: 16px;
      border: 1px solid rgba(86, 31, 41, 0.18);
      border-radius: 14px;
      pointer-events: none;
    }

    .open-card::after {
      inset: 25px;
      border-color: rgba(185, 155, 99, 0.35);
    }

    .wrapper-band {
      position: absolute;
      left: -22%;
      right: -22%;
      top: 44%;
      height: 86px;
      background: linear-gradient(90deg, var(--green), var(--plum), var(--red));
      transform: rotate(-6deg);
      box-shadow: 0 12px 28px rgba(0,0,0,0.25);
      opacity: 0.94;
    }

    .seal {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 30%, rgba(255,255,255,0.28), transparent 20%),
        var(--red);
      color: #f2dfbf;
      display: grid;
      place-items: center;
      margin: 0 auto 26px;
      z-index: 2;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      box-shadow:
        0 9px 20px rgba(0,0,0,0.32),
        inset 0 0 0 2px rgba(255,255,255,0.12);
    }

    .eyebrow {
      position: relative;
      z-index: 2;
      margin: 0 0 20px;
      font-family: Arial, Helvetica, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .open-names {
      position: relative;
      z-index: 2;
      margin: 0;
      font-size: clamp(2.45rem, 12vw, 4.2rem);
      line-height: 0.92;
      font-weight: 400;
      color: var(--ink);
    }

    .amp {
      display: block;
      font-size: 2.2rem;
      line-height: 1.25;
      color: var(--red);
      font-style: italic;
    }

    .tap-note {
      position: relative;
      z-index: 2;
      margin: 28px auto 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.5;
    }

    .controls {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 18px;
    }

    button,
    .button-link {
      appearance: none;
      border: 1px solid rgba(244, 234, 219, 0.28);
      background: rgba(244, 234, 219, 0.1);
      color: var(--paper);
      padding: 13px 18px;
      border-radius: 999px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      transition:
        transform 180ms ease,
        background 180ms ease,
        border-color 180ms ease;
    }

    button:hover,
    .button-link:hover {
      transform: translateY(-1px);
      background: rgba(244, 234, 219, 0.17);
      border-color: rgba(244, 234, 219, 0.45);
    }

    .primary {
      background: var(--paper);
      color: var(--ink);
      border-color: var(--paper);
    }

    .primary:hover {
      background: #fff7ea;
    }

    .progress {
      margin-top: 14px;
      font-family: Arial, Helvetica, sans-serif;
      color: rgba(244, 234, 219, 0.64);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-align: center;
    }

    .footer-note {
      margin-top: 10px;
      color: rgba(244, 234, 219, 0.54);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.7rem;
      text-align: center;
      line-height: 1.4;
    }

    .missing {
      width: 100%;
      max-width: 430px;
      min-height: 260px;
      border-radius: 18px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 24px 70px rgba(0,0,0,0.48);
      padding: 28px;
      text-align: center;
      display: grid;
      place-items: center;
      line-height: 1.5;
    }

    @media (max-height: 700px) {
      body {
        align-items: flex-start;
        padding-top: 12px;
      }

      .app {
        min-height: auto;
      }

      .open-card {
        min-height: 460px;
      }
    }

    @media (min-width: 700px) {
      .app {
        width: 430px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="stage" aria-live="polite">
      <div class="slide" id="slide"></div>
    </section>

    <div class="controls">
      <button id="backBtn" type="button">Back</button>
      <button id="nextBtn" class="primary" type="button">Open</button>
    </div>

    <div class="progress" id="progressText">Invitation</div>

    <div class="footer-note">
      Marco & Jess · October 31st, 2026
    </div>
  </main>

  <script>
    /*
      IMPORTANT:
      Your image files should be uploaded here:

      assets/invite/01-name-strip.png
      assets/invite/02-main-invite.png
      assets/invite/03-details.png
      assets/invite/04-rsvp-card.png

      Replace the RSVP_LINK below with your Google Form link.
    */

    const RSVP_LINK = "https://forms.google.com/YOUR-RSVP-FORM-LINK-HERE";

    const slides = [
      {
        type: "open",
        button: "Open",
        label: "Invitation",
        html: `
          <div class="open-card" role="button" tabindex="0" aria-label="Open wedding invitation">
            <div class="wrapper-band"></div>
            <div class="seal">10·31</div>
            <p class="eyebrow">Wedding Invitation</p>
            <h1 class="open-names">Marco <span class="amp">&</span> Jess</h1>
            <p class="tap-note">Tap to open</p>
          </div>
        `
      },
      {
        type: "image",
        button: "Next",
        label: "1 / 4",
        src: "assets/invite/01-name-strip.png",
        alt: "Marco and Jess name strip"
      },
      {
        type: "image",
        button: "Next",
        label: "2 / 4",
        src: "assets/invite/02-main-invite.png",
        alt: "Main wedding invitation for Marco Maria and Jess Arceo"
      },
      {
        type: "image",
        button: "Next",
        label: "3 / 4",
        src: "assets/invite/03-details.png",
        alt: "Wedding details card"
      },
      {
        type: "image",
        button: "RSVP",
        label: "4 / 4",
        src: "assets/invite/04-rsvp-card.png",
        alt: "RSVP card"
      }
    ];

    let currentSlide = 0;

    const slideEl = document.getElementById("slide");
    const nextBtn = document.getElementById("nextBtn");
    const backBtn = document.getElementById("backBtn");
    const progressText = document.getElementById("progressText");

    function renderSlide() {
      const slide = slides[currentSlide];

      slideEl.className = "slide";

      if (slide.type === "open") {
        slideEl.innerHTML = slide.html;
      }

      if (slide.type === "image") {
        slideEl.innerHTML = `
          <img
            class="image-card"
            src="${slide.src}"
            alt="${slide.alt}"
            onerror="this.outerHTML='<div class=&quot;missing&quot;><div><strong>Image missing</strong><br>${slide.src}<br><br>Check the file name and folder path.</div></div>'"
          />
        `;
      }

      backBtn.style.visibility = currentSlide === 0 ? "hidden" : "visible";
      nextBtn.textContent = slide.button;
      progressText.textContent = slide.label;

      const clickable = slideEl.querySelector(".open-card, .image-card");
      if (clickable) {
        clickable.addEventListener("click", () => {
          if (currentSlide < slides.length - 1) {
            goNext();
          }
        });

        clickable.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            if (currentSlide < slides.length - 1) {
              goNext();
            }
          }
        });
      }
    }

    function goNext() {
      if (currentSlide === slides.length - 1) {
        window.open(RSVP_LINK, "_blank");
        return;
      }

      slideEl.classList.add("fade-out");

      setTimeout(() => {
        currentSlide += 1;
        renderSlide();
      }, 250);
    }

    function goBack() {
      if (currentSlide === 0) return;

      slideEl.classList.add("fade-out");

      setTimeout(() => {
        currentSlide -= 1;
        renderSlide();
      }, 250);
    }

    nextBtn.addEventListener("click", goNext);
    backBtn.addEventListener("click", goBack);

    renderSlide();
  </script>
</body>
</html>
