<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Marco & Jess Wedding Invitation</title>

  <style>
    :root {
      --bg: #100c0d;
      --paper: #f4eadb;
      --ink: #241817;
      --muted: rgba(244, 234, 219, 0.68);
      --red: #561f29;
      --green: #1d3a2c;
      --plum: #3b243d;
      --gold: #b99b63;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(86, 31, 41, 0.45), transparent 34%),
        radial-gradient(circle at bottom right, rgba(29, 58, 44, 0.38), transparent 34%),
        radial-gradient(circle at center, rgba(185, 155, 99, 0.08), transparent 45%),
        var(--bg);
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    body {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .app {
      width: min(94vw, 430px);
      min-height: 92svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .top-bar {
      width: 100%;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin-bottom: 12px;
    }

    .back-arrow {
      display: none;
      width: 42px;
      height: 42px;
      border-radius: 999px;
      border: 1px solid rgba(244, 234, 219, 0.32);
      background: rgba(244, 234, 219, 0.08);
      color: var(--paper);
      font-size: 1.35rem;
      line-height: 1;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.22);
    }

    .back-arrow.show {
      display: inline-flex;
    }

    .stage {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1200px;
    }

    .card-shell {
      width: 100%;
      max-width: 430px;
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      animation: cardEnter 420ms ease both;
    }

    @keyframes cardEnter {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .whole-card {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      background: #eadcc8;
      box-shadow:
        0 24px 70px rgba(0, 0, 0, 0.48),
        0 2px 0 rgba(255,255,255,0.08) inset;
      pointer-events: none;
    }

    .split-card {
      width: 100%;
      position: relative;
      border-radius: 18px;
      overflow: visible;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.48);
      transform-style: preserve-3d;
    }

    .split-base {
      width: 100%;
      height: auto;
      display: block;
      opacity: 0;
      pointer-events: none;
    }

    .flap {
      position: absolute;
      top: 0;
      width: 50%;
      height: 100%;
      overflow: hidden;
      background: #eadcc8;
      backface-visibility: hidden;
      transition:
        transform 900ms cubic-bezier(.2,.8,.2,1),
        opacity 700ms ease,
        filter 700ms ease;
      will-change: transform, opacity;
    }

    .flap img {
      position: absolute;
      top: 0;
      width: 200%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }

    .flap-left {
      left: 0;
      border-radius: 18px 0 0 18px;
      transform-origin: left center;
    }

    .flap-left img {
      left: 0;
    }

    .flap-right {
      right: 0;
      border-radius: 0 18px 18px 0;
      transform-origin: right center;
    }

    .flap-right img {
      right: 0;
    }

    .card-shell.opening .flap-left {
      transform: translateX(-42%) rotateY(-72deg);
      opacity: 0;
      filter: brightness(0.76);
    }

    .card-shell.opening .flap-right {
      transform: translateX(42%) rotateY(72deg);
      opacity: 0;
      filter: brightness(0.76);
    }

    .card-shell.opening {
      pointer-events: none;
    }

    .card-shell.exit {
      animation: cardExit 300ms ease both;
    }

    @keyframes cardExit {
      from {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
      to {
        opacity: 0;
        transform: translateY(-14px) scale(0.96);
      }
    }

    .hint {
      margin-top: 16px;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 0.72rem;
      color: var(--muted);
      line-height: 1.6;
    }

    .dots {
      display: flex;
      justify-content: center;
      gap: 7px;
      margin-top: 10px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: rgba(244, 234, 219, 0.28);
      transition: all 220ms ease;
    }

    .dot.active-dot {
      width: 20px;
      background: rgba(244, 234, 219, 0.82);
    }

    .rsvp-button {
      display: none;
      margin-top: 18px;
      appearance: none;
      border: 1px solid var(--paper);
      background: var(--paper);
      color: var(--ink);
      padding: 14px 22px;
      border-radius: 999px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
    }

    .rsvp-button.show {
      display: inline-flex;
    }

    .form-screen {
      display: none;
      width: 100%;
      max-width: 430px;
      background: var(--paper);
      color: var(--ink);
      border-radius: 20px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.48);
      padding: 28px;
      animation: cardEnter 360ms ease both;
    }

    .form-screen.show {
      display: block;
    }

    .form-screen h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      font-weight: 400;
      text-align: center;
    }

    .form-screen p {
      margin: 0 0 22px;
      color: #725f56;
      line-height: 1.5;
      text-align: center;
      font-size: 0.95rem;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-family: Arial, Helvetica, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 0.68rem;
      color: #561f29;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid rgba(36, 24, 23, 0.18);
      background: rgba(255,255,255,0.48);
      border-radius: 12px;
      padding: 13px 12px;
      font: inherit;
      color: var(--ink);
    }

    textarea {
      resize: vertical;
      min-height: 92px;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .form-actions button {
      flex: 1;
      appearance: none;
      border-radius: 999px;
      border: 1px solid rgba(36, 24, 23, 0.2);
      padding: 13px 16px;
      font-family: Arial, Helvetica, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.11em;
      font-size: 0.72rem;
      cursor: pointer;
    }

    .submit-btn {
      background: var(--red);
      color: var(--paper);
      border-color: var(--red);
    }

    .back-btn {
      background: transparent;
      color: var(--ink);
    }

    .status {
      margin-top: 14px;
      text-align: center;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      color: #561f29;
      line-height: 1.4;
    }

    .missing {
      width: 100%;
      min-height: 220px;
      border-radius: 18px;
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 24px 70px rgba(0,0,0,0.48);
      padding: 28px;
      text-align: center;
      display: grid;
      place-items: center;
      line-height: 1.5;
    }

    @media (max-height: 720px) {
      body {
        align-items: flex-start;
        padding-top: 12px;
      }

      .app {
        min-height: auto;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="top-bar">
      <button class="back-arrow" id="backArrow" type="button" aria-label="Go back">←</button>
    </div>

    <section class="stage" id="stage" aria-label="Wedding invitation">
      <!-- Card loads here -->
    </section>

    <button class="rsvp-button" id="rsvpButton" type="button">RSVP</button>

    <div class="hint" id="hintText">
      tap to open
    </div>

    <div class="dots" id="dots"></div>

    <section class="form-screen" id="formScreen" aria-label="RSVP form">
      <h1>Kindly Reply</h1>
      <p>Please submit your RSVP by the third of July.</p>

      <form id="rsvpForm" action="https://formspree.io/f/YOUR_ID_HERE" method="POST">
        <div class="field">
          <label for="name">Your name</label>
          <input id="name" name="name" type="text" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="attending">Will you be attending?</label>
          <select id="attending" name="attending" required>
            <option value="">Choose one</option>
            <option value="Gratefully accepts">Gratefully accepts</option>
            <option value="Respectfully declines">Respectfully declines</option>
          </select>
        </div>

        <div class="field">
          <label for="guests">Number of guests</label>
          <input id="guests" name="number_of_guests" type="number" min="0" max="10" placeholder="Example: 2" />
        </div>

        <div class="field">
          <label for="notes">Food allergies / notes</label>
          <textarea id="notes" name="notes" placeholder="Optional"></textarea>
        </div>

        <div class="form-actions">
          <button class="back-btn" id="formBackBtn" type="button">Back</button>
          <button class="submit-btn" type="submit">Submit</button>
        </div>

        <div class="status" id="formStatus"></div>
      </form>
    </section>
  </main>

  <script>
    const cards = [
      {
        src: "assets/invite/01-name-strip.png",
        alt: "Marco and Jess name strip",
        split: true
      },
      {
        src: "assets/invite/02-main-invite.png",
        alt: "Main wedding invitation for Marco Maria and Jess Arceo",
        split: false
      },
      {
        src: "assets/invite/03-details.png",
        alt: "Wedding details card",
        split: false
      },
      {
        src: "assets/invite/04-rsvp-card.png",
        alt: "RSVP card",
        split: false
      }
    ];

    let currentIndex = 0;
    let isAnimating = false;

    const stage = document.getElementById("stage");
    const backArrow = document.getElementById("backArrow");
    const hintText = document.getElementById("hintText");
    const dots = document.getElementById("dots");
    const rsvpButton = document.getElementById("rsvpButton");
    const formScreen = document.getElementById("formScreen");
    const formBackBtn = document.getElementById("formBackBtn");
    const rsvpForm = document.getElementById("rsvpForm");
    const formStatus = document.getElementById("formStatus");

    function buildDots() {
      dots.innerHTML = "";

      cards.forEach((_, index) => {
        const dot = document.createElement("div");
        dot.className = "dot";
        if (index === currentIndex) dot.classList.add("active-dot");
        dots.appendChild(dot);
      });
    }

    function renderCard() {
      const card = cards[currentIndex];

      stage.style.display = "flex";
      formScreen.classList.remove("show");

      rsvpButton.classList.toggle("show", currentIndex === cards.length - 1);
      backArrow.classList.toggle("show", currentIndex > 0);

      hintText.style.display = "block";
      dots.style.display = "flex";

      hintText.textContent =
        currentIndex === cards.length - 1
          ? "tap RSVP to respond"
          : "tap card to open";

      if (card.split) {
        stage.innerHTML = `
          <div class="card-shell" id="activeCard" role="button" tabindex="0" aria-label="Open card">
            <div class="split-card">
              <img class="split-base" src="${card.src}" alt="" draggable="false">
              <div class="flap flap-left">
                <img src="${card.src}" alt="${card.alt}" draggable="false"
                  onerror="this.closest('.card-shell').innerHTML='<div class=&quot;missing&quot;><div><strong>Image missing</strong><br>${card.src}<br><br>Check the file name and folder path.</div></div>'">
              </div>
              <div class="flap flap-right">
                <img src="${card.src}" alt="" draggable="false">
              </div>
            </div>
          </div>
        `;
      } else {
        stage.innerHTML = `
          <div class="card-shell" id="activeCard" role="button" tabindex="0" aria-label="Open card">
            <img
              class="whole-card"
              src="${card.src}"
              alt="${card.alt}"
              draggable="false"
              onerror="this.outerHTML='<div class=&quot;missing&quot;><div><strong>Image missing</strong><br>${card.src}<br><br>Check the file name and folder path.</div></div>'"
            />
          </div>
        `;
      }

      const activeCard = document.getElementById("activeCard");

      if (activeCard) {
        activeCard.addEventListener("click", openCurrentCard);
        activeCard.addEventListener("keydown", function(event) {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            openCurrentCard();
          }
        });
      }

      buildDots();
    }

    function openCurrentCard() {
      if (isAnimating) return;

      if (currentIndex === cards.length - 1) {
        return;
      }

      isAnimating = true;

      const card = cards[currentIndex];
      const activeCard = document.getElementById("activeCard");

      if (!activeCard) {
        isAnimating = false;
        return;
      }

      if (card.split) {
        activeCard.classList.add("opening");

        setTimeout(() => {
          activeCard.classList.add("exit");
        }, 620);

        setTimeout(() => {
          currentIndex += 1;
          isAnimating = false;
          renderCard();
        }, 980);
      } else {
        activeCard.classList.add("exit");

        setTimeout(() => {
          currentIndex += 1;
          isAnimating = false;
          renderCard();
        }, 300);
      }
    }

    function goBack() {
      if (isAnimating) return;

      if (formScreen.classList.contains("show")) {
        closeForm();
        return;
      }

      if (currentIndex > 0) {
        currentIndex -= 1;
        renderCard();
      }
    }

    function openForm() {
      stage.style.display = "none";
      rsvpButton.classList.remove("show");
      hintText.style.display = "none";
      dots.style.display = "none";
      backArrow.classList.add("show");
      formScreen.classList.add("show");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closeForm() {
      formScreen.classList.remove("show");
      renderCard();
    }

    rsvpButton.addEventListener("click", openForm);
    backArrow.addEventListener("click", goBack);
    formBackBtn.addEventListener("click", closeForm);

    rsvpForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const formAction = rsvpForm.getAttribute("action");

      if (formAction.includes("YOUR_ID_HERE")) {
        formStatus.textContent = "RSVP form is not connected yet. Add your Formspree endpoint first.";
        return;
      }

      formStatus.textContent = "Submitting...";

      try {
        const response = await fetch(formAction, {
          method: "POST",
          body: new FormData(rsvpForm),
          headers: {
            "Accept": "application/json"
          }
        });

        if (response.ok) {
          formStatus.textContent = "Thank you. Your RSVP has been received.";
          rsvpForm.reset();
        } else {
          formStatus.textContent = "Something went wrong. Please try again.";
        }
      } catch (error) {
        formStatus.textContent = "Something went wrong. Please check your connection and try again.";
      }
    });

    renderCard();
  </script>
</body>
</html>
